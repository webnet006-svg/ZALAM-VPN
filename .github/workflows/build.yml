name: Build ZALAM VPN APK

on:
  push:
    branches: [ testing ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724"

      - name: Build libbox.aar from source
        run: |
          export GOMAXPROCS=2
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p clients/android/app/libs
          gomobile bind -target=android/arm64,android/arm -androidapi 24 \
            -o clients/android/app/libs/libbox.aar \
            github.com/sagernet/sing-box/experimental/libbox

      - name: Fix AIDL and SDK path
        run: |
          cd clients/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.newDsl=false" >> gradle.properties

      - name: Build APK with Gradle
        run: |
          cd clients/android
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZALAM-VPN-Debug-APK
          path: clients/android/app/build/outputs/apk/other/debug/*.apk
          retention-days: 7
