name: Build ZALAM VPN APK

on:
  push:
    branches: [ testing ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.0.13004108"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a578e44e30224243e6ec044e028" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Build libbox.aar from source
        run: |
          export GOMAXPROCS=2
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME

          # Install official SagerNet gomobile and gobind
          make lib_install
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

          # Build libbox.aar and libbox-legacy.aar using sing-box official build tool
          go run ./cmd/internal/build_libbox -target android -platform android/arm64,android/arm

          mkdir -p clients/android/app/libs
          cp -f libbox.aar libbox-legacy.aar clients/android/app/libs/

      - name: Fix AIDL and SDK path
        run: |
          cd clients/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.newDsl=false" >> gradle.properties

      - name: Build APK with Gradle
        run: |
          cd clients/android
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZALAM-VPN-Debug-APK
          path: clients/android/app/build/outputs/apk/other/debug/*.apk
          retention-days: 7
